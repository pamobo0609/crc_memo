# Runs the test suite on pushes to main and on pull requests — only when code changes.
# Free: GitHub Actions has unlimited minutes on standard runners for public repos.
name: tests

# Docs-only changes (README, CLAUDE.md, CONTRIBUTING.md, docs/, .claude/) skip CI.
# prompts/ and glossary/ live under crc_memo/ and count as code: they change behavior.
on:
  push:
    branches: [main]
    paths:
      - "crc_memo/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/**"
  pull_request:
    paths:  # same list as push
      - "crc_memo/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/**"

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tests convert real audio (opus/ogg/m4a), so they need ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # uv reads .python-version and installs Python 3.12 itself.
      # Pinned to an exact version: setup-uv doesn't publish moving major tags (no `v10`).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      # Coverage gate (100% line + branch) is configured in pyproject.toml.
      - name: Run tests
        run: uv run pytest
