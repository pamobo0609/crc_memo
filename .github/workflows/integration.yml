# Real Whisper on synthetic Spanish speech (tests/integration/) — guards transcription quality.
# macOS only: needs `say` for speech and MLX for the model.
# Free: standard macOS runners are free and unlimited for public repos (private would be billed).
name: integration

# Runs only when transcription code changes (any branch), or manually from the Actions tab.
on:
  push:
    paths:
      - "crc_memo/transcribe.py"
      - "crc_memo/ingest.py"
      - "crc_memo/config.py"
      - "tests/integration/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whisper:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # A missing voice or model fails the job instead of skipping (a skip would be a false green).
      CRC_MEMO_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: command -v ffmpeg || brew install ffmpeg

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # ~1.6 GB model, downloaded once and reused (cache is free up to 10 GB per repo).
      # Change the key if WHISPER_MODEL changes in config.py.
      - name: Cache Whisper model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-whisper-large-v3-turbo-v1

      # Answers "does MLX get the GPU, and is the Spanish voice installed?" in the log.
      - name: Diagnostics
        run: |
          sysctl -n machdep.cpu.brand_string
          system_profiler SPDisplaysDataType | grep -E "Chipset Model|Metal" || echo "no GPU info"
          say -v '?' | grep -E "es_(MX|ES)" || echo "no Spanish voices"
          uv run python -c "import mlx.core as mx; print('MLX default device:', mx.default_device())"

      - name: Integration tests
        run: uv run pytest -m integration --no-cov -v
