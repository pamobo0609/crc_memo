[project]
name = "crc-memo"
version = "0.1.0"
description = "Local voice memo transcriber and summarizer for Costa Rican Spanish (CLI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "typst>=0.15.0",
]

[project.scripts]
memo = "crc_memo.cli:app"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Line + branch coverage of the app package; anything under 100% fails the run.
addopts = "--cov=crc_memo --cov-branch --cov-report=term-missing --cov-fail-under=100 -m 'not integration'"
# Opt-in: real models, slow, macOS-only. Run with: uv run pytest -m integration --no-cov
markers = ["integration: real Whisper/ffmpeg end-to-end; skipped by default"]
